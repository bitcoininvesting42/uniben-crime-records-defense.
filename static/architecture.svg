<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 270" role="img" aria-label="Three-tier architecture diagram">
<defs><style>.box{fill:#f9fcfc;stroke:#d9e9eb;stroke-width:1.6}.title{font:700 20px system-ui,sans-serif;fill:#1a3547}.label{font:700 14px system-ui,sans-serif;fill:#244158}.small{font:500 11px system-ui,sans-serif;fill:#70899b}.arrow{stroke:#65bdb0;stroke-width:2.5;fill:none}.pill{fill:#e7f8f3;stroke:#b6e7d8}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#65bdb0"/></marker></defs>
<text class="title" x="22" y="36">System Architecture</text><text class="small" x="22" y="58">Browser interface → Python HTTP API → SQLite relational database</text>
<rect class="box" x="20" y="94" width="242" height="125" rx="16"/><rect class="pill" x="40" y="113" width="65" height="25" rx="7"/><text class="small" x="73" y="130" text-anchor="middle">TIER 1</text><text class="label" x="40" y="161">Web Interface</text><text class="small" x="40" y="182">HTML · CSS · JavaScript</text><text class="small" x="40" y="200">Dashboard · forms · reports</text>
<rect class="box" x="356" y="94" width="242" height="125" rx="16"/><rect class="pill" x="376" y="113" width="65" height="25" rx="7"/><text class="small" x="409" y="130" text-anchor="middle">TIER 2</text><text class="label" x="376" y="161">Application Layer</text><text class="small" x="376" y="182">Python · REST-style endpoints</text><text class="small" x="376" y="200">Validation · roles · audit log</text>
<rect class="box" x="692" y="94" width="242" height="125" rx="16"/><rect class="pill" x="712" y="113" width="65" height="25" rx="7"/><text class="small" x="745" y="130" text-anchor="middle">TIER 3</text><text class="label" x="712" y="161">Database Layer</text><text class="small" x="712" y="182">SQLite relational storage</text><text class="small" x="712" y="200">Cases · incidents · activity</text>
<path class="arrow" d="M270 157 H345" marker-end="url(#a)"/><path class="arrow" d="M606 157 H681" marker-end="url(#a)"/><text class="small" x="307" y="144" text-anchor="middle">JSON</text><text class="small" x="643" y="144" text-anchor="middle">SQL</text>
<text class="small" x="475" y="250" text-anchor="middle">Authenticated role-based access · HTTP-only session cookie · application-level activity history</text>
</svg>
